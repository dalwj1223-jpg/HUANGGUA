<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>千岛 - 夏日跳跳乐 (纯脱机单文件完整版)</title>
  <meta name="description" content="100%纯脱机、零外部依赖的夏日水上跳跃游戏，可直接双击离线运行">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 430px;
      max-height: 932px;
      background: #eaf5ce;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
    }
    @media (min-width: 500px) {
      #game-container {
        height: 94vh;
        border-radius: 36px;
        border: 4px solid rgba(255, 255, 255, 0.2);
      }
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    /* Top Header Bar */
    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }
    .hud-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 6px 12px;
      border-radius: 9999px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      font-size: 14px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }
    .badge-label {
      color: #fbbf24;
      font-size: 11px;
      font-weight: 700;
    }
    .hud-controls {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }
    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.15s ease;
      outline: none;
    }
    .icon-btn:active {
      transform: scale(0.92);
      background: rgba(15, 23, 42, 0.8);
    }

    /* Onscreen Mobile Controls */
    .mobile-controls {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 20px;
      pointer-events: none;
      z-index: 10;
    }
    .shoot-btn {
      pointer-events: auto;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      border: 3px solid #ffffff;
      box-shadow: 0 8px 24px rgba(2, 132, 199, 0.45);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      cursor: pointer;
      font-weight: 900;
      font-size: 13px;
      transition: transform 0.1s ease;
      outline: none;
    }
    .shoot-btn:active {
      transform: scale(0.9);
      background: linear-gradient(135deg, #0284c7, #0369a1);
    }
    .shoot-btn span {
      font-size: 20px;
      line-height: 1;
    }

    /* Modal Screens */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 20;
    }
    .card {
      width: 100%;
      max-width: 320px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 28px;
      padding: 26px 22px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      text-align: center;
      position: relative;
    }
    .card-title {
      font-size: 24px;
      font-weight: 900;
      color: #0f172a;
      margin-bottom: 6px;
    }
    .card-subtitle {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 20px;
    }
    .score-box {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-around;
    }
    .score-item-val {
      font-size: 22px;
      font-weight: 900;
      color: #0284c7;
    }
    .score-item-lbl {
      font-size: 11px;
      color: #64748b;
      font-weight: 600;
      margin-top: 2px;
    }
    .primary-btn {
      width: 100%;
      padding: 14px;
      border-radius: 9999px;
      border: none;
      background: linear-gradient(135deg, #f43f5e, #fb7185);
      color: #fff;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(244, 63, 94, 0.4);
      transition: transform 0.15s ease;
      outline: none;
      margin-bottom: 10px;
    }
    .primary-btn:active {
      transform: scale(0.96);
    }
    .secondary-btn {
      width: 100%;
      padding: 11px;
      border-radius: 9999px;
      border: 2px solid #cbd5e1;
      background: #fff;
      color: #334155;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease;
      outline: none;
    }
    .secondary-btn:active {
      background: #f1f5f9;
    }
    .rules-list {
      text-align: left;
      font-size: 12px;
      color: #334155;
      line-height: 1.6;
      margin-bottom: 18px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 14px;
      padding: 12px;
    }
    .combo-banner {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(90deg, #f59e0b, #ef4444);
      color: #fff;
      padding: 6px 18px;
      border-radius: 9999px;
      font-weight: 900;
      font-size: 15px;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.5);
      z-index: 15;
      pointer-events: none;
      animation: popBounce 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popBounce {
      0% { transform: translateX(-50%) scale(0.6); opacity: 0; }
      100% { transform: translateX(-50%) scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="375" height="812"></canvas>

    <!-- Top HUD -->
    <div class="top-bar">
      <div class="hud-left">
        <div class="badge">
          <span class="badge-label">得分</span>
          <span id="score-text">0</span>
        </div>
        <div class="badge">
          <span class="badge-label">水球</span>
          <span id="ammo-text">200</span>
        </div>
      </div>
      <div class="hud-controls">
        <button id="sound-btn" class="icon-btn" title="声音开/关">🔊</button>
        <button id="pause-btn" class="icon-btn" title="暂停">⏸️</button>
      </div>
    </div>

    <!-- Onscreen Shoot Button for Mobile -->
    <div class="mobile-controls">
      <div style="font-size: 11px; color: rgba(255,255,255,0.7); background: rgba(0,0,0,0.3); padding: 4px 8px; border-radius: 8px;">
        👈 左右滑动控制方向 👉
      </div>
      <button id="mobile-shoot-btn" class="shoot-btn">
        <span>💧</span>发射
      </button>
    </div>

    <!-- Combo Alert Banner -->
    <div id="combo-banner" class="combo-banner" style="display: none;">
      🔥 连击 x<span id="combo-count">2</span> 叮当！
    </div>

    <!-- Start Screen Overlay -->
    <div id="start-overlay" class="modal-overlay">
      <div class="card">
        <div style="font-size: 42px; margin-bottom: 6px;">🏖️ 🥒 🌊</div>
        <div class="card-title">千岛 · 夏日跳跳乐</div>
        <div class="card-subtitle">纯脱机单文件版 · 随时随地畅玩</div>

        <div class="rules-list">
          <div>🥒 <b>踩踏黄瓜/水上浮台</b>：持续向上跳跃攀登</div>
          <div>⚠️ <b>避开红色尖刺陷阱</b>：碰到即结束游戏</div>
          <div>💧 <b>发射清凉水球/踩踏</b>：消灭各种水上海怪</div>
          <div>🎵 <b>连击消灭海怪</b>：触发清脆递增连击叮当音效！</div>
        </div>

        <div class="score-box">
          <div>
            <div class="score-item-val" id="start-high-score">0</div>
            <div class="score-item-lbl">历史最高分</div>
          </div>
          <div>
            <div class="score-item-val" style="color: #10b981;">100%</div>
            <div class="score-item-lbl">离线纯净运行</div>
          </div>
        </div>

        <button id="start-btn" class="primary-btn">开始游戏</button>
      </div>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameover-overlay" class="modal-overlay" style="display: none;">
      <div class="card">
        <div style="font-size: 40px; margin-bottom: 6px;" id="gameover-emoji">🌊</div>
        <div class="card-title" id="gameover-title">游戏结束</div>
        <div class="card-subtitle" id="gameover-subtitle">落水啦！再接再厉！</div>

        <div class="score-box">
          <div>
            <div class="score-item-val" id="over-final-score">0</div>
            <div class="score-item-lbl">本次得分</div>
          </div>
          <div>
            <div class="score-item-val" style="color: #f59e0b;" id="over-high-score">0</div>
            <div class="score-item-lbl">历史纪录</div>
          </div>
          <div>
            <div class="score-item-val" style="color: #ef4444;" id="over-max-combo">0</div>
            <div class="score-item-lbl">最高连击</div>
          </div>
        </div>

        <button id="retry-btn" class="primary-btn">再玩一次</button>
      </div>
    </div>

    <!-- Pause Overlay -->
    <div id="pause-overlay" class="modal-overlay" style="display: none;">
      <div class="card">
        <div style="font-size: 36px; margin-bottom: 8px;">⏸️</div>
        <div class="card-title">游戏已暂停</div>
        <div class="card-subtitle">休息一下，随时继续</div>
        <button id="resume-btn" class="primary-btn">继续游戏</button>
      </div>
    </div>
  </div>

  <script>
    /* =========================================================
       1. 纯脱机 Web Audio 声音合成器 (无需任何外部 MP3/WAV)
       ========================================================= */
    class OfflineSoundSynthesizer {
      constructor() {
        this.ctx = null;
        this.muted = false;
        try {
          this.muted = localStorage.getItem('ribbon_sound_muted') === 'true';
        } catch(e) {}
      }

      init() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            this.ctx = new AudioContextClass();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      }

      toggleMute() {
        this.muted = !this.muted;
        try {
          localStorage.setItem('ribbon_sound_muted', String(this.muted));
        } catch(e) {}
        return this.muted;
      }

      // 普通跳跃音效
      playJump() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(280, now);
          osc.frequency.exponentialRampToValueAtTime(560, now + 0.12);
          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.13);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.14);
        } catch(e) {}
      }

      // 弹簧高跳音效
      playSpring() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.linearRampToValueAtTime(880, now + 0.2);
          osc.frequency.linearRampToValueAtTime(660, now + 0.35);
          gain.gain.setValueAtTime(0.32, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.38);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.4);
        } catch(e) {}
      }

      // 水球射击音效
      playShoot() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(900, now);
          osc.frequency.exponentialRampToValueAtTime(220, now + 0.09);
          gain.gain.setValueAtTime(0.24, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.11);
        } catch(e) {}
      }

      // 消灭海怪音效
      playMonsterPop() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(450, now);
          osc.frequency.exponentialRampToValueAtTime(950, now + 0.08);
          osc.frequency.exponentialRampToValueAtTime(140, now + 0.22);
          gain.gain.setValueAtTime(0.28, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.24);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.25);
        } catch(e) {}
      }

      // 递增五声音阶连击清脆叮当音效 (ding-dong)
      playComboDing(combo) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const scale = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
          const idx = Math.min(Math.max(0, combo - 1), scale.length - 1);
          const semi = scale[idx];
          const baseFreq = 784; // G5
          const fund = baseFreq * Math.pow(2, semi / 12);

          // 第一声清脆水晶铃声
          const osc1 = this.ctx.createOscillator();
          const gain1 = this.ctx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(fund, now);
          gain1.gain.setValueAtTime(0.3, now);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
          osc1.connect(gain1);
          gain1.connect(this.ctx.destination);
          osc1.start(now);
          osc1.stop(now + 0.29);

          // 铃声泛音
          const osc2 = this.ctx.createOscillator();
          const gain2 = this.ctx.createGain();
          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(fund * 2.75, now);
          gain2.gain.setValueAtTime(0.16, now);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
          osc2.connect(gain2);
          gain2.connect(this.ctx.destination);
          osc2.start(now);
          osc2.stop(now + 0.18);

          // 连击 >= 2 时发出双音节叮-当
          if (combo >= 2) {
            const delayed = now + 0.055;
            const secondFreq = fund * 1.26;
            const oscDong = this.ctx.createOscillator();
            const gainDong = this.ctx.createGain();
            oscDong.type = 'sine';
            oscDong.frequency.setValueAtTime(secondFreq, delayed);
            gainDong.gain.setValueAtTime(0.24, delayed);
            gainDong.gain.exponentialRampToValueAtTime(0.001, delayed + 0.25);
            oscDong.connect(gainDong);
            gainDong.connect(this.ctx.destination);
            oscDong.start(delayed);
            oscDong.stop(delayed + 0.27);
          }
        } catch(e) {}
      }

      // 触碰红色陷阱音效
      playTrapHit() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(340, now);
          osc.frequency.linearRampToValueAtTime(110, now + 0.3);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.32);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.34);
        } catch(e) {}
      }

      // 坠落落水音效
      playFall() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.45);
          gain.gain.setValueAtTime(0.28, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.48);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.5);
        } catch(e) {}
      }
    }

    const sound = new OfflineSoundSynthesizer();

    /* =========================================================
       2. 游戏核心状态与物理参数
       ========================================================= */
    const W = 375;
    const H = 812;
    const GRAVITY = 0.38;
    const JUMP_VELOCITY = -11.4;
    const SPRING_VELOCITY = -18.8;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let highScore = 0;
    try {
      highScore = parseInt(localStorage.getItem('ribbon_high_score') || '0', 10);
    } catch(e) {}
    document.getElementById('start-high-score').textContent = highScore;

    let gameState = {
      started: false,
      paused: false,
      gameOver: false,
      score: 0,
      highScore: highScore,
      cameraY: 0,
      highestY: H - 90,
      ammo: 200,
      comboCount: 0,
      maxCombo: 0,
      comboTimer: 0,
      player: {
        x: W / 2 - 20,
        y: H - 150,
        width: 40,
        height: 48,
        vx: 0,
        vy: 0,
        facing: 'right',
        squashTimer: 0,
        stretchTimer: 0,
        rotation: 0
      },
      platforms: [],
      monsters: [],
      projectiles: [],
      particles: [],
      floatingDew: []
    };

    // 初始化背景环境光斑露珠
    for (let i = 0; i < 35; i++) {
      gameState.floatingDew.push({
        x: Math.random() * W,
        y: Math.random() * H,
        size: Math.random() * 2 + 1,
        alpha: Math.random() * 0.5 + 0.2,
        speed: Math.random() * 0.4 + 0.1
      });
    }

    // 初始化平台
    function initPlatforms() {
      const plats = [];
      // 初始安全起始平台
      plats.push({
        id: 1,
        x: W / 2 - 45,
        y: H - 90,
        width: 90,
        height: 18,
        type: 'standard', // standard, moving, breakable, spring, trap
        vx: 0,
        broken: false
      });

      let curY = H - 90;
      let idCounter = 2;
      while (curY > -100) {
        curY -= (Math.floor(Math.random() * 28) + 52);
        const pWidth = Math.floor(Math.random() * 35) + 65;
        const pX = Math.random() * (W - pWidth - 30) + 15;
        
        let type = 'standard';
        let vx = 0;
        const rand = Math.random();
        if (rand < 0.20) {
          type = 'moving';
          vx = (Math.random() > 0.5 ? 1 : -1) * (1.2 + Math.random() * 0.8);
        } else if (rand < 0.32) {
          type = 'breakable';
        } else if (rand < 0.44) {
          type = 'spring';
        } else if (rand < 0.53 && curY < H - 250) {
          type = 'trap'; // 红色危险方块
        }

        plats.push({
          id: idCounter++,
          x: pX,
          y: curY,
          width: pWidth,
          height: 18,
          type: type,
          vx: vx,
          broken: false
        });

        // 适量生成水上海怪
        if (Math.random() < 0.18 && curY < H - 200 && type !== 'trap') {
          gameState.monsters.push({
            id: idCounter++,
            x: Math.random() * (W - 70) + 20,
            y: curY - 50,
            width: 42,
            height: 38,
            type: Math.random() > 0.5 ? 'jellyfish' : 'octopus',
            vx: (Math.random() - 0.5) * 1.5,
            alive: true
          });
        }
      }
      return plats;
    }

    /* =========================================================
       3. 绘图系统 (纯 Canvas 原生矢量渲染，零图片外部请求)
       ========================================================= */

    // 绘制格子桌布背景与阳光 (Image 1 风格)
    function drawWorldBackground(cameraY, timeMs) {
      // 1. 阳光渐变底色
      const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
      bgGrad.addColorStop(0, '#EAF5CE');
      bgGrad.addColorStop(0.5, '#F8FCEF');
      bgGrad.addColorStop(1, '#E6F3CE');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, W, H);

      // 2. 经典餐布绿白格子条纹
      const step = 44;
      const scrollY = (cameraY * 0.3) % step;
      ctx.fillStyle = 'rgba(180, 224, 130, 0.26)';
      for (let x = 0; x < W; x += step * 2) {
        ctx.fillRect(x, 0, step, H);
      }
      for (let y = scrollY - step; y < H + step; y += step * 2) {
        ctx.fillRect(0, y, W, step);
      }

      // 3. 漂浮的环境光斑露珠
      gameState.floatingDew.forEach(d => {
        const dy = (d.y - cameraY * 0.25) % H;
        const fy = dy < 0 ? dy + H : dy;
        const fx = d.x + Math.sin(timeMs * 0.0015 + d.y) * 5;
        ctx.save();
        ctx.beginPath();
        ctx.arc(fx, fy, d.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${d.alpha})`;
        ctx.shadowColor = 'rgba(255, 255, 255, 0.8)';
        ctx.shadowBlur = 6;
        ctx.fill();
        ctx.restore();
      });

      // 4. 右上角切片青瓜装饰轮
      ctx.save();
      ctx.translate(W - 15, 25);
      ctx.beginPath();
      ctx.arc(0, 0, 65, 0, Math.PI * 2);
      ctx.fillStyle = '#649738';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(0, 0, 58, 0, Math.PI * 2);
      ctx.fillStyle = '#C8E698';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(0, 0, 52, 0, Math.PI * 2);
      ctx.fillStyle = '#E5F6C6';
      ctx.fill();
      // 青瓜籽
      for (let i = 0; i < 8; i++) {
        const rad = (i * Math.PI) / 4;
        ctx.beginPath();
        ctx.ellipse(Math.cos(rad) * 26, Math.sin(rad) * 26, 4, 2, rad, 0, Math.PI * 2);
        ctx.fillStyle = '#89B852';
        ctx.fill();
      }
      ctx.restore();
    }

    // 绘制主角专属吉祥物 (紫色软糯身躯、小斜帽、眨眼萌脸、白色肚脐、a形腿)
    function drawMascot(player, timeMs) {
      ctx.save();
      const cx = player.x + player.width / 2;
      const cy = player.y + player.height / 2;
      ctx.translate(cx, cy);

      // 翻转朝向
      if (player.facing === 'left') {
        ctx.scale(-1, 1);
      }

      // 弹性缩放 (Squash & Stretch)
      let sx = 1, sy = 1;
      if (player.squashTimer > 0) {
        sx = 1.15;
        sy = 0.85;
      } else if (player.vy < -2) {
        sy = 1.18;
        sx = 0.88;
      } else if (player.vy > 2) {
        sx = 1.08;
        sy = 0.94;
      }
      ctx.scale(sx, sy);

      // 1. 后腿
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(-6, 17, 5, 8, -0.2, 0, Math.PI * 2);
      ctx.fillStyle = '#7a60d6';
      ctx.fill();
      ctx.restore();

      // 2. 左手 (自然垂摆)
      ctx.save();
      ctx.strokeStyle = '#1e1a29';
      ctx.lineWidth = 3.2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-13, 2);
      ctx.quadraticCurveTo(-18, 5, -21, 8);
      ctx.stroke();
      ctx.restore();

      // 3. 圆滚滚主躯体
      ctx.save();
      ctx.beginPath();
      ctx.arc(0, -2, 17.5, 0, Math.PI * 2);
      const bodyGrad = ctx.createRadialGradient(-4, -6, 2, 0, -2, 18);
      bodyGrad.addColorStop(0, '#C2B6FF');
      bodyGrad.addColorStop(0.4, '#9F8AF9');
      bodyGrad.addColorStop(1, '#785FD9');
      ctx.fillStyle = bodyGrad;
      ctx.fill();
      ctx.restore();

      // 4. 前腿 (小 'a' 弯钩曲线)
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(-4, 9);
      ctx.bezierCurveTo(2, 14, 9, 13, 12, 17);
      ctx.bezierCurveTo(15, 20, 14, 24, 8, 24);
      ctx.bezierCurveTo(3, 24, 0, 20, -1, 15);
      ctx.closePath();
      ctx.fillStyle = '#947FF5';
      ctx.fill();
      ctx.restore();

      // 5. 白色圆肚皮 (标志性特征)
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(1, 5, 6, 5, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#FFFFFF';
      ctx.fill();
      ctx.restore();

      // 6. 右手 (欢快扬起打招呼)
      ctx.save();
      ctx.strokeStyle = '#1e1a29';
      ctx.lineWidth = 3.2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      const wave = Math.sin(timeMs * 0.01) * 2;
      ctx.moveTo(13, 2);
      ctx.quadraticCurveTo(18, 0 + wave, 22, -4 + wave);
      ctx.stroke();
      ctx.restore();

      // 7. 标志性歪戴深紫冒险帽子 (左上倾斜)
      ctx.save();
      ctx.translate(-7, -18);
      ctx.rotate(-0.25);
      // 帽檐
      ctx.beginPath();
      ctx.ellipse(0, 5, 15, 4.5, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#392C62';
      ctx.fill();
      // 帽冠
      ctx.beginPath();
      ctx.roundRect(-8, -9, 16, 12, [6, 6, 2, 2]);
      ctx.fillStyle = '#4D3B82';
      ctx.fill();
      // 帽带
      ctx.beginPath();
      ctx.roundRect(-8, 1, 16, 3, 1);
      ctx.fillStyle = '#FF758F';
      ctx.fill();
      ctx.restore();

      // 8. 招牌五官表情 (左眼眨眼笑，右眼亮晶晶大圆眼，微笑嘴角)
      // 左眼: 弯弯眨眼
      ctx.save();
      ctx.strokeStyle = '#1E1A29';
      ctx.lineWidth = 2.4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(-5.5, -4, 3.2, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();
      ctx.restore();

      // 右眼: 大圆眼 + 高光
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(6, -4, 3.8, 4.4, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#1E1A29';
      ctx.fill();
      // 亮白眼神光
      ctx.beginPath();
      ctx.arc(4.8, -5.5, 1.4, 0, Math.PI * 2);
      ctx.fillStyle = '#FFFFFF';
      ctx.fill();
      ctx.restore();

      // 甜美微笑
      ctx.save();
      ctx.strokeStyle = '#1E1A29';
      ctx.lineWidth = 2.2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(0.5, -1, 3.5, 0.2 * Math.PI, 0.8 * Math.PI);
      ctx.stroke();
      ctx.restore();

      // 萌萌粉红腮红
      ctx.save();
      ctx.beginPath();
      ctx.arc(-8, -0.5, 2.5, 0, Math.PI * 2);
      ctx.arc(9, -0.5, 2.5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 130, 160, 0.45)';
      ctx.fill();
      ctx.restore();

      ctx.restore();
    }

    // 绘制平台 (标准青瓜浮板、移动板、弹簧板、易碎云朵、红色尖刺陷阱)
    function drawPlatform(p) {
      ctx.save();
      if (p.type === 'trap') {
        // 🔴 危险红色尖刺陷阱方块
        const grad = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.height);
        grad.addColorStop(0, '#FF4D6D');
        grad.addColorStop(1, '#C9184A');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.roundRect(p.x, p.y, p.width, p.height, 6);
        ctx.fill();

        // 警示尖刺纹理
        ctx.fillStyle = '#FFF0F3';
        const spikes = 5;
        const spikeW = p.width / spikes;
        for (let i = 0; i < spikes; i++) {
          ctx.beginPath();
          ctx.moveTo(p.x + i * spikeW, p.y);
          ctx.lineTo(p.x + (i + 0.5) * spikeW, p.y - 6);
          ctx.lineTo(p.x + (i + 1) * spikeW, p.y);
          ctx.fill();
        }
      } else if (p.type === 'spring') {
        // 🟡 弹簧高跳平台
        const grad = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.height);
        grad.addColorStop(0, '#FBBF24');
        grad.addColorStop(1, '#D97706');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.roundRect(p.x, p.y, p.width, p.height, 9);
        ctx.fill();

        // 弹簧垫
        ctx.fillStyle = '#EF4444';
        ctx.beginPath();
        ctx.roundRect(p.x + p.width / 2 - 12, p.y - 7, 24, 7, 3);
        ctx.fill();
      } else if (p.type === 'moving') {
        // 🔵 移动水上冲浪浮台
        const grad = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.height);
        grad.addColorStop(0, '#38BDF8');
        grad.addColorStop(1, '#0284C7');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.roundRect(p.x, p.y, p.width, p.height, 9);
        ctx.fill();

        // 冲浪板水波纹
        ctx.strokeStyle = '#BAE6FD';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(p.x + 8, p.y + p.height / 2);
        ctx.lineTo(p.x + p.width - 8, p.y + p.height / 2);
        ctx.stroke();
      } else if (p.type === 'breakable') {
        // ⚪ 易碎气泡云朵平台
        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.beginPath();
        ctx.roundRect(p.x, p.y, p.width, p.height, 8);
        ctx.fill();
        ctx.strokeStyle = '#93C5FD';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      } else {
        // 🥒 默认鲜嫩青瓜片长板浮台 (Image 1 主打元素)
        const grad = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.height);
        grad.addColorStop(0, '#86EFAC');
        grad.addColorStop(0.3, '#4ADE80');
        grad.addColorStop(1, '#22C55E');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.roundRect(p.x, p.y, p.width, p.height, 9);
        ctx.fill();

        // 青瓜边缘深绿瓜皮
        ctx.strokeStyle = '#15803D';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 青瓜清脆小白籽
        ctx.fillStyle = '#DCFCE7';
        for (let i = 1; i <= 3; i++) {
          ctx.beginPath();
          ctx.ellipse(p.x + (p.width * i) / 4, p.y + p.height / 2, 3.5, 1.8, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();
    }

    // 绘制水上海怪/水母
    function drawMonster(m, timeMs) {
      if (!m.alive) return;
      ctx.save();
      const cx = m.x + m.width / 2;
      const cy = m.y + m.height / 2;
      ctx.translate(cx, cy);

      const bob = Math.sin(timeMs * 0.005 + m.id) * 3;
      ctx.translate(0, bob);

      if (m.type === 'jellyfish') {
        // 🪼 发光水母
        ctx.beginPath();
        ctx.arc(0, -4, 18, Math.PI, 0);
        ctx.fillStyle = 'rgba(236, 72, 153, 0.85)';
        ctx.fill();
        // 触角
        ctx.strokeStyle = '#F472B6';
        ctx.lineWidth = 2;
        for (let i = -12; i <= 12; i += 6) {
          ctx.beginPath();
          ctx.moveTo(i, -4);
          ctx.quadraticCurveTo(i + Math.sin(timeMs * 0.01 + i) * 4, 10, i, 16);
          ctx.stroke();
        }
      } else {
        // 🐙 调皮小章鱼
        ctx.beginPath();
        ctx.arc(0, -2, 18, 0, Math.PI * 2);
        ctx.fillStyle = '#8B5CF6';
        ctx.fill();
        // 眼睛
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.arc(-6, -4, 5, 0, Math.PI * 2);
        ctx.arc(6, -4, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#1E1B4B';
        ctx.beginPath();
        ctx.arc(-6, -4, 2.5, 0, Math.PI * 2);
        ctx.arc(6, -4, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // 绘制水球子弹与飞溅水花粒子
    function drawProjectilesAndParticles() {
      // 1. 水球子弹
      gameState.projectiles.forEach(pr => {
        ctx.save();
        ctx.beginPath();
        ctx.arc(pr.x, pr.y, 6.5, 0, Math.PI * 2);
        const waterGrad = ctx.createRadialGradient(pr.x - 2, pr.y - 2, 1, pr.x, pr.y, 7);
        waterGrad.addColorStop(0, '#FFFFFF');
        waterGrad.addColorStop(0.5, '#38BDF8');
        waterGrad.addColorStop(1, '#0284C7');
        ctx.fillStyle = waterGrad;
        ctx.shadowColor = 'rgba(56, 189, 248, 0.8)';
        ctx.shadowBlur = 8;
        ctx.fill();
        ctx.restore();
      });

      // 2. 粒子水花
      gameState.particles.forEach(p => {
        ctx.save();
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fill();
        ctx.restore();
      });
    }

    // 产生消灭水花粒子
    function createSplash(x, y, color = '#38BDF8', count = 12) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = Math.random() * 4 + 1.5;
        gameState.particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          size: Math.random() * 3.5 + 1.5,
          color: color,
          alpha: 1,
          decay: Math.random() * 0.03 + 0.02
        });
      }
    }

    /* =========================================================
       4. 游戏主循环与物理逻辑更新
       ========================================================= */

    function shootWaterBall() {
      if (!gameState.started || gameState.paused || gameState.gameOver) return;
      if (gameState.ammo <= 0) return;

      gameState.ammo--;
      document.getElementById('ammo-text').textContent = gameState.ammo;
      sound.playShoot();

      const px = gameState.player.x + gameState.player.width / 2;
      const py = gameState.player.y;
      gameState.projectiles.push({
        x: px,
        y: py,
        vx: (Math.random() - 0.5) * 0.6,
        vy: -14
      });
    }

    function checkCollisions() {
      const pl = gameState.player;

      // 只有在下落时才发生跳跃反弹检测
      if (pl.vy > 0) {
        for (let p of gameState.platforms) {
          if (p.broken) continue;
          const feetY = pl.y + pl.height;
          // 落在平台顶端检测
          if (
            pl.x + pl.width * 0.7 > p.x &&
            pl.x + pl.width * 0.3 < p.x + p.width &&
            feetY >= p.y &&
            feetY <= p.y + p.height + pl.vy
          ) {
            if (p.type === 'trap') {
              // 踩中红色陷阱 -> 触发警报音效并直接判定结束
              sound.playTrapHit();
              triggerGameOver('trap', '踩中红色尖刺陷阱！');
              return;
            } else if (p.type === 'spring') {
              pl.vy = SPRING_VELOCITY;
              pl.squashTimer = 10;
              sound.playSpring();
              createSplash(pl.x + pl.width / 2, p.y, '#FBBF24', 16);
            } else if (p.type === 'breakable') {
              pl.vy = JUMP_VELOCITY;
              pl.squashTimer = 8;
              p.broken = true;
              sound.playJump();
              createSplash(p.x + p.width / 2, p.y, '#FFFFFF', 14);
            } else {
              pl.vy = JUMP_VELOCITY;
              pl.squashTimer = 8;
              sound.playJump();
              createSplash(pl.x + pl.width / 2, p.y, '#4ADE80', 8);
            }
            break;
          }
        }

        // 踩踩击败怪物
        for (let m of gameState.monsters) {
          if (!m.alive) continue;
          if (
            pl.x + pl.width > m.x &&
            pl.x < m.x + m.width &&
            pl.y + pl.height >= m.y &&
            pl.y + pl.height <= m.y + m.height * 0.6
          ) {
            m.alive = false;
            pl.vy = JUMP_VELOCITY * 1.15;
            handleMonsterDefeat(m.x + m.width / 2, m.y + m.height / 2);
            break;
          }
        }
      }

      // 水球子弹击中怪物
      for (let i = gameState.projectiles.length - 1; i >= 0; i--) {
        const pr = gameState.projectiles[i];
        for (let m of gameState.monsters) {
          if (!m.alive) continue;
          const dist = Math.hypot(pr.x - (m.x + m.width / 2), pr.y - (m.y + m.height / 2));
          if (dist < 26) {
            m.alive = false;
            gameState.projectiles.splice(i, 1);
            handleMonsterDefeat(m.x + m.width / 2, m.y + m.height / 2);
            break;
          }
        }
      }
    }

    // 击溃海怪奖励与递增连击音效
    function handleMonsterDefeat(x, y) {
      createSplash(x, y, '#EC4899', 20);
      gameState.score += 200;

      // 递增连击数并在窗口期内上升音调
      gameState.comboCount++;
      gameState.comboTimer = 2200; // 2.2秒连击判定窗口
      if (gameState.comboCount > gameState.maxCombo) {
        gameState.maxCombo = gameState.comboCount;
      }

      sound.playMonsterPop();
      sound.playComboDing(gameState.comboCount);

      // 显示连击横幅
      if (gameState.comboCount >= 2) {
        const banner = document.getElementById('combo-banner');
        document.getElementById('combo-count').textContent = gameState.comboCount;
        banner.style.display = 'block';
        clearTimeout(window.comboBannerTimeout);
        window.comboBannerTimeout = setTimeout(() => {
          banner.style.display = 'none';
        }, 1500);
      }
    }

    function triggerGameOver(reason, message) {
      gameState.gameOver = true;
      sound.playFall();

      // 更新历史最高分
      if (gameState.score > gameState.highScore) {
        gameState.highScore = gameState.score;
        try {
          localStorage.setItem('ribbon_high_score', String(gameState.highScore));
        } catch(e) {}
      }

      document.getElementById('over-final-score').textContent = gameState.score;
      document.getElementById('over-high-score').textContent = gameState.highScore;
      document.getElementById('over-max-combo').textContent = gameState.maxCombo;
      document.getElementById('gameover-subtitle').textContent = message;
      document.getElementById('gameover-overlay').style.display = 'flex';
    }

    let lastTime = 0;
    function gameLoop(timeMs) {
      requestAnimationFrame(gameLoop);

      const dt = Math.min(32, timeMs - lastTime || 16);
      lastTime = timeMs;

      if (!gameState.started || gameState.paused) {
        render();
        return;
      }

      if (gameState.gameOver) {
        render();
        return;
      }

      // 1. 连击计时器倒数
      if (gameState.comboTimer > 0) {
        gameState.comboTimer -= dt;
        if (gameState.comboTimer <= 0) {
          gameState.comboCount = 0;
        }
      }

      const pl = gameState.player;

      // 2. 玩家水平移动与回弹
      pl.x += pl.vx;
      if (pl.vx > 0.1) pl.facing = 'right';
      if (pl.vx < -0.1) pl.facing = 'left';

      // 屏幕两侧穿越
      if (pl.x < -pl.width) pl.x = W;
      if (pl.x > W) pl.x = -pl.width;

      // 3. 玩家垂直重力与运动
      pl.vy += GRAVITY;
      pl.y += pl.vy;
      if (pl.squashTimer > 0) pl.squashTimer--;

      // 4. 移动平台更新
      gameState.platforms.forEach(p => {
        if (p.type === 'moving') {
          p.x += p.vx;
          if (p.x <= 10 || p.x + p.width >= W - 10) {
            p.vx = -p.vx;
          }
        }
      });

      // 5. 碰撞检测
      checkCollisions();

      // 6. 相机平滑跟拍向上滚动
      const targetCameraY = (H * 0.45) - pl.y;
      if (targetCameraY > gameState.cameraY) {
        const diff = targetCameraY - gameState.cameraY;
        gameState.cameraY += diff * 0.1;
        // 分数增加
        const currentClimb = Math.floor(gameState.cameraY * 1.5);
        if (currentClimb > gameState.score) {
          gameState.score = currentClimb;
          document.getElementById('score-text').textContent = gameState.score;
        }
      }

      // 7. 生成上方新平台，清除下方无用平台
      const topPlatform = gameState.platforms[gameState.platforms.length - 1];
      if (topPlatform && topPlatform.y > -gameState.cameraY - 120) {
        const newY = topPlatform.y - (Math.floor(Math.random() * 26) + 54);
        const pWidth = Math.floor(Math.random() * 35) + 65;
        const pX = Math.random() * (W - pWidth - 30) + 15;
        let type = 'standard';
        let vx = 0;
        const r = Math.random();
        if (r < 0.22) {
          type = 'moving';
          vx = (Math.random() > 0.5 ? 1 : -1) * (1.2 + Math.random() * 0.8);
        } else if (r < 0.34) {
          type = 'breakable';
        } else if (r < 0.46) {
          type = 'spring';
        } else if (r < 0.55) {
          type = 'trap';
        }

        gameState.platforms.push({
          id: Date.now() + Math.random(),
          x: pX,
          y: newY,
          width: pWidth,
          height: 18,
          type: type,
          vx: vx,
          broken: false
        });

        // 概率生成上方怪物
        if (Math.random() < 0.2 && type !== 'trap') {
          gameState.monsters.push({
            id: Date.now() + Math.random(),
            x: Math.random() * (W - 70) + 20,
            y: newY - 48,
            width: 42,
            height: 38,
            type: Math.random() > 0.5 ? 'jellyfish' : 'octopus',
            vx: (Math.random() - 0.5) * 1.5,
            alive: true
          });
        }
      }

      // 清除屏幕下方 150px 以下的过时平台与怪物
      const screenBottomY = H - gameState.cameraY + 150;
      gameState.platforms = gameState.platforms.filter(p => p.y < screenBottomY);
      gameState.monsters = gameState.monsters.filter(m => m.y < screenBottomY && m.alive);

      // 8. 水球子弹飞行
      for (let i = gameState.projectiles.length - 1; i >= 0; i--) {
        const pr = gameState.projectiles[i];
        pr.x += pr.vx;
        pr.y += pr.vy;
        if (pr.y < -gameState.cameraY - 50) {
          gameState.projectiles.splice(i, 1);
        }
      }

      // 9. 粒子衰减
      for (let i = gameState.particles.length - 1; i >= 0; i--) {
        const p = gameState.particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;
        if (p.alpha <= 0) {
          gameState.particles.splice(i, 1);
        }
      }

      // 10. 落水判定 (掉出屏幕下方)
      if (pl.y > H - gameState.cameraY + 60) {
        triggerGameOver('fall', '不小心掉入水底啦！');
      }

      render();
    }

    function render() {
      ctx.clearRect(0, 0, W, H);
      const now = performance.now();

      // 绘制背景 (含相机视差)
      drawWorldBackground(gameState.cameraY, now);

      // 应用相机变换
      ctx.save();
      ctx.translate(0, gameState.cameraY);

      // 绘制平台
      gameState.platforms.forEach(p => {
        if (!p.broken) drawPlatform(p);
      });

      // 绘制海怪
      gameState.monsters.forEach(m => drawMonster(m, now));

      // 绘制子弹与粒子水花
      drawProjectilesAndParticles();

      // 绘制吉祥物角色
      drawMascot(gameState.player, now);

      ctx.restore();
    }

    /* =========================================================
       5. 交互控制 (支持键盘、鼠标拖动、手机触屏手势)
       ========================================================= */

    // 键盘支持
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        gameState.player.vx = -6.5;
      } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        gameState.player.vx = 6.5;
      } else if (e.key === ' ' || e.key === 'ArrowUp') {
        shootWaterBall();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (['ArrowLeft', 'a', 'A', 'ArrowRight', 'd', 'D'].includes(e.key)) {
        gameState.player.vx = 0;
      }
    });

    // 触摸与鼠标水平拖动
    let touchStartX = 0;
    canvas.addEventListener('touchstart', (e) => {
      const touch = e.touches[0];
      const rect = canvas.getBoundingClientRect();
      touchStartX = (touch.clientX - rect.left) * (W / rect.width);
      // 如果点击屏幕上半区直接射击水球
      const touchY = (touch.clientY - rect.top) * (H / rect.height);
      if (touchY < H * 0.6) {
        shootWaterBall();
      }
    }, { passive: true });

    canvas.addEventListener('touchmove', (e) => {
      const touch = e.touches[0];
      const rect = canvas.getBoundingClientRect();
      const currentX = (touch.clientX - rect.left) * (W / rect.width);
      const diffX = currentX - touchStartX;
      gameState.player.vx = Math.max(-7.5, Math.min(7.5, diffX * 0.25));
      touchStartX = currentX;
    }, { passive: true });

    canvas.addEventListener('touchend', () => {
      gameState.player.vx = 0;
    }, { passive: true });

    // 鼠标点击发射与拖动
    let isMouseDown = false;
    canvas.addEventListener('mousedown', (e) => {
      isMouseDown = true;
      const rect = canvas.getBoundingClientRect();
      touchStartX = (e.clientX - rect.left) * (W / rect.width);
      shootWaterBall();
    });

    window.addEventListener('mousemove', (e) => {
      if (!isMouseDown) return;
      const rect = canvas.getBoundingClientRect();
      const currentX = (e.clientX - rect.left) * (W / rect.width);
      const diffX = currentX - touchStartX;
      gameState.player.vx = Math.max(-7.5, Math.min(7.5, diffX * 0.3));
      touchStartX = currentX;
    });

    window.addEventListener('mouseup', () => {
      isMouseDown = false;
      gameState.player.vx = 0;
    });

    // 按钮事件
    document.getElementById('mobile-shoot-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      shootWaterBall();
    });

    document.getElementById('sound-btn').addEventListener('click', () => {
      const isMuted = sound.toggleMute();
      document.getElementById('sound-btn').textContent = isMuted ? '🔇' : '🔊';
    });

    document.getElementById('pause-btn').addEventListener('click', () => {
      if (!gameState.started || gameState.gameOver) return;
      gameState.paused = true;
      document.getElementById('pause-overlay').style.display = 'flex';
    });

    document.getElementById('resume-btn').addEventListener('click', () => {
      gameState.paused = false;
      document.getElementById('pause-overlay').style.display = 'none';
    });

    document.getElementById('start-btn').addEventListener('click', () => {
      sound.init();
      document.getElementById('start-overlay').style.display = 'none';
      startGame();
    });

    document.getElementById('retry-btn').addEventListener('click', () => {
      document.getElementById('gameover-overlay').style.display = 'none';
      startGame();
    });

    function startGame() {
      gameState.started = true;
      gameState.paused = false;
      gameState.gameOver = false;
      gameState.score = 0;
      gameState.cameraY = 0;
      gameState.ammo = 200;
      gameState.comboCount = 0;
      gameState.maxCombo = 0;
      gameState.comboTimer = 0;

      gameState.player = {
        x: W / 2 - 20,
        y: H - 150,
        width: 40,
        height: 48,
        vx: 0,
        vy: JUMP_VELOCITY,
        facing: 'right',
        squashTimer: 0,
        stretchTimer: 0,
        rotation: 0
      };

      gameState.monsters = [];
      gameState.projectiles = [];
      gameState.particles = [];
      gameState.platforms = initPlatforms();

      document.getElementById('score-text').textContent = '0';
      document.getElementById('ammo-text').textContent = '200';
      sound.playJump();
    }

    // 启动动画循环
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
